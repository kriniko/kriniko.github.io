name: Social Media Post

on:
  schedule:
    # Every day except Mon & Thu (poem days) at 11:00 UTC (13:00 Sofia time)
    - cron: '0 11 * * 0'
    - cron: '0 11 * * 2'
    - cron: '0 11 * * 3'
    - cron: '0 11 * * 5'
    - cron: '0 11 * * 6'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-and-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Generate social post
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINIAPI }}
          TENOR_API_KEY: ${{ secrets.TENOR_API_KEY }}
        run: python scripts/generate_social.py

      - name: Post to Buffer
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFERAPI }}
          BUFFER_FACEBOOK_CHANNEL_ID: ${{ secrets.BUFFER_FACEBOOK_CHANNEL_ID }}
          BUFFER_FACEBOOK_CHANNEL_NAME: ${{ secrets.BUFFER_FACEBOOK_CHANNEL_NAME }}
        run: python scripts/post_to_buffer.py social

      - name: Commit social history
        run: |
          git config user.name "Kristina"
          git config user.email "kriniko@gmail.com"
          git remote set-url origin https://x-access-token:${{ secrets.GHP }}@github.com/kriniko/kriniko.github.io.git
          git add content/social-history.json static/images/social/
          git diff --cached --quiet || git commit -m "chore: update social post history - $(date +%Y-%m-%d)"
          git push

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Social post generation or publishing failed — check the steps above."
