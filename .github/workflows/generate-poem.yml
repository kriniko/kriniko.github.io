name: Weekly Satirical Poem

on:
  schedule:
    # Every Wednesday at 10:00 UTC (12:00 Sofia time)
    - cron: '0 10 * * 3'
  workflow_dispatch:
    inputs:
      topic:
        description: 'Optional topic override (leave empty for auto)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Add topic from manual trigger
        if: github.event.inputs.topic != ''
        run: |
          echo "${{ github.event.inputs.topic }}" >> content/topics-queue.txt

      - name: Generate poem
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/generate_poem.py

      - name: Commit and push
        run: |
          git config user.name "Kristina"
          git config user.email "kriniko@gmail.com"
          git add content/ static/images/
          git commit -m "feat: weekly poem - $(date +%Y-%m-%d)

          Auto-generated satirical article about Bulgarian bureaucracy.

          Co-Authored-By: Гише ∞ Bot <noreply@gisheto.com>"
          git push

      - name: Wait for deploy
        run: sleep 180

      - name: Post to Buffer
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python scripts/post_to_buffer.py
