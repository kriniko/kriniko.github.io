name: Publish Satirical Poem

on:
  schedule:
    # Monday and Thursday at 10:00 UTC (12:00 Sofia time)
    - cron: '0 10 * * 1'
    - cron: '0 10 * * 4'
  workflow_dispatch:
    inputs:
      topic:
        description: 'Optional topic override (leave empty for auto)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Add topic from manual trigger
        if: github.event.inputs.topic != ''
        run: |
          echo "${{ github.event.inputs.topic }}" >> content/topics-queue.txt

      - name: Generate poem
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CANVA_API_KEY: ${{ secrets.CANVA_API_KEY }}
          CANVA_TEMPLATE_ID: ${{ secrets.CANVA_TEMPLATE_ID }}
        run: python scripts/generate_poem.py

      - name: Commit and push
        run: |
          git config user.name "Kristina"
          git config user.email "kriniko@gmail.com"
          git remote set-url origin https://x-access-token:${{ secrets.GH_PAT }}@github.com/kriniko/kriniko.github.io.git
          git add content/ static/images/
          git commit -m "feat: new poem - $(date +%Y-%m-%d)

          Auto-generated satirical article about Bulgarian bureaucracy.

          Co-Authored-By: Гише ∞ Bot <noreply@gisheto.com>"
          git push

      - name: Wait for deploy
        run: sleep 180

      - name: Post to Buffer
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_FACEBOOK_CHANNEL_ID: ${{ secrets.BUFFER_FACEBOOK_CHANNEL_ID }}
          BUFFER_FACEBOOK_CHANNEL_NAME: ${{ secrets.BUFFER_FACEBOOK_CHANNEL_NAME }}
        run: python scripts/post_to_buffer.py article

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Poem generation or publishing failed — check the steps above."
